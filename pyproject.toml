[project]
name = "quant-project"
version = "0.1.0"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["models", "calibration", "pricing", "data", "strategies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slow tests (simulation, training, dataset generation)",
]